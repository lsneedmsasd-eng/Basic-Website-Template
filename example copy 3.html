    var canvas = document.getElementById("gameCanvas");

    var CELL = 20;
    var snake = { x: 5, y: 5 };
    var dx = 20; // how far snake.x changes each step
    var dy = 0;  // how far snake.y changes each step 
function step() {
  snake.x = snake.x + dx;
  snake.y = snake.y + dy;
  drawBoard();
}
    function drawBoard() {
  ctx.fillStyle = "#1b1b1b";
  ctx.fillRect(0, 0, 400, 400);
 
  ctx.fillStyle = "#3ddc84";
  ctx.fillRect(snake.x, snake.y, 20, 20);
}
